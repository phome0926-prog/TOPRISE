<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#0c1a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOPRISE">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>トップライズ｜手法選定アドバイザー</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Barlow+Condensed:wght@500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0b1630;--card:#132043;--card2:#1a2b56;--ink:#eef3f9;--mut:#a3b2cc;--line:#2c3f6e;--accent:#62a4d8;--accent2:#2e5497;--sky:#8fc3ea;--warn:#ff7a45}
html,body{height:100%}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:radial-gradient(900px 500px at 90% -5%,rgba(98,164,216,.20),transparent 60%),radial-gradient(700px 460px at -5% 110%,rgba(46,84,151,.30),transparent 55%),var(--bg);color:var(--ink);min-height:100%;-webkit-font-smoothing:antialiased}
.app{max-width:1180px;margin:0 auto;padding:24px 20px 50px}
header.h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.16em;font-size:1.3rem}
.logo b{color:var(--accent)}
.htag{font-size:.72rem;color:var(--mut);letter-spacing:.04em}
.home{font-size:.86rem;font-weight:800;color:#fff;text-decoration:none;background:var(--card2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;white-space:nowrap}
.home:active{transform:scale(.97)}
/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{flex:1;min-width:150px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:14px;padding:13px 16px;font-weight:700;font-size:.95rem;text-align:center;transition:.15s}
.tab .s{display:block;font-size:.72rem;font-weight:400;margin-top:2px;color:var(--mut)}
.tab.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(98,164,216,.18),var(--card));color:#fff}
.tab.on .s{color:var(--accent)}
/* progress */
.prog{display:flex;gap:6px;margin-bottom:18px}
.prog .p{flex:1;height:5px;border-radius:3px;background:var(--card2)}
.prog .p.on{background:var(--accent)}
/* step block */
.step h2{font-size:1.2rem;font-weight:900;margin-bottom:4px}
.step .sd{color:var(--mut);font-size:.86rem;margin-bottom:16px}
.opts{display:grid;gap:12px}
.opts.g4{grid-template-columns:repeat(4,1fr)}
.opts.g2{grid-template-columns:repeat(2,1fr)}
.opts.g3{grid-template-columns:repeat(3,1fr)}
.opts.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:820px){.opts.g4,.opts.g5{grid-template-columns:repeat(2,1fr)}.opts.g3{grid-template-columns:1fr}}
@media(max-width:520px){.opts.g4,.opts.g5,.opts.g2{grid-template-columns:1fr}}
.opt{cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:18px;transition:.15s;text-align:left}
.opt:active{transform:scale(.97)}
.opt.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(98,164,216,.16),var(--card));box-shadow:0 12px 30px -16px rgba(98,164,216,.6)}
.opt .ic{font-size:1.5rem;margin-bottom:6px}
.opt .ttl{font-weight:800;font-size:1rem}
.opt .sub{font-size:.78rem;color:var(--mut);margin-top:3px;font-weight:400}
.nav{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.btn{cursor:pointer;border:none;border-radius:12px;padding:12px 20px;font-weight:800;font-size:.95rem;font-family:inherit}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn.prim{background:var(--accent);color:#07142b}
.btn.prim:disabled{opacity:.4}
.hintbar{font-size:.8rem;color:var(--mut);margin-top:14px;display:flex;gap:8px;align-items:center}
.hintbar::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent2)}
/* result */
.result{animation:pop .3s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.rhero{background:linear-gradient(135deg,#1d3a7a,#0f1e45);border:1px solid var(--line);border-radius:20px;padding:24px 26px;margin-bottom:16px;position:relative;overflow:hidden}
.rhero::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(98,164,216,.28),transparent 70%)}
.rhero .rk{font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;font-size:.74rem;color:var(--accent);font-weight:700;margin-bottom:6px}
.rhero h2{font-size:1.5rem;font-weight:900;line-height:1.35;position:relative;z-index:1}
.rhero .mlist{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;position:relative;z-index:1}
.mchip{background:rgba(98,164,216,.18);border:1px solid rgba(98,164,216,.55);color:#e6f2fb;border-radius:30px;padding:6px 14px;font-weight:800;font-size:.9rem}
.mchip small{font-weight:500;color:var(--mut);margin-left:5px}
.sect{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.sect .sh{font-family:'Barlow Condensed',sans-serif;letter-spacing:.12em;font-size:.74rem;color:var(--accent);font-weight:700;margin-bottom:10px}
.why li{list-style:none;display:flex;gap:10px;font-size:.95rem;line-height:1.6;margin-bottom:8px}
.why li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:8px}
.why li:last-child{margin-bottom:0}
.why .base{color:var(--mut)}
/* cost bars */
.cost .row{display:grid;grid-template-columns:130px 1fr 46px;gap:12px;align-items:center;margin-bottom:10px}
.cost .row:last-child{margin-bottom:0}
.cost .bk{font-size:.88rem;font-weight:700}
.cost .bar{height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.cost .bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent2),var(--sky))}
.cost .lv{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--mut);font-size:.82rem;text-align:right}
.cost .lead{font-size:.84rem;color:var(--mut);margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.cost .lead b{color:#fff}
.notes{margin-top:0}
.note{display:flex;gap:10px;background:rgba(255,122,69,.1);border:1px solid rgba(255,122,69,.34);border-radius:12px;padding:11px 14px;font-size:.86rem;color:#ffd2bc;line-height:1.6;margin-bottom:8px}
.note:last-child{margin-bottom:0}
.note b{color:#fff}
.deliv img{width:100%;height:auto;border-radius:12px;display:block;border:1px solid var(--line)}
.deliv .dcap{font-size:.84rem;color:var(--mut);margin-top:8px}
.out{font-size:.96rem}.out b{color:#fff}
.linkbtn{display:inline-block;margin-top:8px;background:var(--card2);border:1px solid var(--line);color:var(--accent);text-decoration:none;font-weight:700;font-size:.86rem;padding:8px 14px;border-radius:10px}
/* reverse */
.rev{display:grid;gap:12px}
.rev.g4{grid-template-columns:repeat(2,1fr)}.rev.g5{grid-template-columns:repeat(2,1fr)}
@media(max-width:680px){.rev.g4,.rev.g5{grid-template-columns:1fr}}
.revcard{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:18px;transition:.15s}
.revcard:active{transform:scale(.98)}
.revcard.on{border-color:var(--accent)}
.revcard .rt{font-weight:800;font-size:1.05rem}
.revcard .rtag{display:inline-block;font-size:.72rem;color:var(--accent);background:rgba(98,164,216,.12);border:1px solid rgba(98,164,216,.34);padding:2px 9px;border-radius:20px;margin-top:6px}
.revcard .rg{font-size:.86rem;color:var(--mut);margin-top:8px;line-height:1.6}
.revout{margin-top:16px}
.cta{margin-top:22px;background:linear-gradient(135deg,#1d3a7a,#0f1e45);border:1px solid var(--line);border-radius:18px;padding:22px 24px;position:relative;overflow:hidden}
.cta .ctk{font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;font-size:.74rem;color:var(--accent);font-weight:700;margin-bottom:6px}
.cta h3{font-size:1.2rem;font-weight:900;margin-bottom:8px}
.cta h3 span{color:var(--accent)}
.cta .tel{background:var(--accent);color:#07142b;font-weight:800;text-decoration:none;padding:11px 18px;border-radius:11px;display:inline-flex;gap:8px;align-items:center}
.cta .tel small{opacity:.7;font-family:'Barlow Condensed',sans-serif}
.editnote{margin-top:14px;background:rgba(255,122,69,.1);border:1px dashed rgba(255,122,69,.5);border-radius:10px;padding:10px 14px;font-size:.78rem;color:#ffc7ac;line-height:1.6}
.editnote b{color:var(--warn)}
.hide{display:none}
@media print{
  body{background:#fff!important;color:#111}
  .tabs,.cta,.nav,.home,.hintbar,.prog{display:none!important}
  .rhero,.sect{background:#fff!important;border:1px solid #bbb!important;color:#111!important;box-shadow:none!important;break-inside:avoid}
  .rhero h2,.sect .sh,.why li,.out,.cost .bk,.cost .lv,.note,.deliv .dcap{color:#111!important}
  .mchip{color:#111!important;border-color:#333!important;background:#fff!important}
  .cost .bar{background:#e5e5e5!important}.cost .bar>i{background:#2e5497!important}
  .note{background:#fff5ee!important;border-color:#e08a5a!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="h">
    <div class="logo">TOP<b>RISE</b></div>
    <div style="display:flex;gap:10px;align-items:center"><a class="home" href="index.html">⌂ トップに戻る</a><span class="htag">手法選定アドバイザー</span></div>
  </header>

  <div class="tabs">
    <div class="tab on" data-mode="flow" onclick="setMode('flow')">提案フロー<span class="s">対象→制約→ゴール</span></div>
    <div class="tab" data-mode="bymethod" onclick="setMode('bymethod')">手法から逆引き<span class="s">「○○って何ができる？」</span></div>
    <div class="tab" data-mode="bygoal" onclick="setMode('bygoal')">成果物から逆引き<span class="s">「○○がしたい」</span></div>
  </div>

  <div id="view"></div>

  <div class="cta">
    <div class="ctk">CONTACT — お問い合わせ</div>
    <h3>手法も作業コストも、<span>御社の現場に合わせて</span>ご提案します。</h3>
    <a class="tel" href="tel:0250244648">&#128222; 0250-24-4648 <small>株式会社トップライズ 本社・本店</small></a>
    <div class="editnote"><b>&#9888; 営業ご担当者へ：</b>選定ロジック・注意コメント・連絡先は <b>advisor_core</b> 内のデータ1か所で調整できます。費用は金額ではなく「作業コスト（工程ごとの手間）」で表示しています。</div>
  </div>
</div>

<script>
/* ============================================================
   TOPRISE 手法選定アドバイザー — マスターデータ & エンジン
   正引き(対象→制約→ゴール) と 逆引き(手法/成果物) を
   すべてこの 1 ファイルのデータから生成する。
   ※ ここを直せば全画面に反映される（単一マスター方式）
   ============================================================ */

/* --- 手法マスター --- */
const METHODS = {
  uav:    { name:"DJI Matrice 350 RTK", short:"UAV（ドローン）", tag:"上空・広域",
            good:"広い屋外を上空から一気に。写真測量(P1)・レーザー(L1)・赤外線(H20T)を付け替え。",
            sheet:"toprise_sheet_uav.html" },
  navvis: { name:"NavVis VLX",          short:"NavVis（歩行）",  tag:"屋内・狭所・供用中",
            good:"背負って歩くだけ。据え付け不要で供用中・橋梁下・屋内も止めずに取得。",
            sheet:"toprise_sheet_navvis.html" },
  p40:    { name:"Leica ScanStation P40",short:"Leica P40（据置）",tag:"高精度・構造物",
            good:"三脚に据えてmm級の高精度。構造物の精密計測・変位・出来形に。",
            sheet:"toprise_sheet_p40.html" }
};

/* --- 対象マスター（STEP1）。primary=第一候補 / alt=代替・補強 --- */
const TARGETS = {
  terrain:  { ico:"🏞", label:"地形・広域",   sub:"造成地・河川・斜面など", primary:["uav"],         alt:["p40"] },
  structure:{ ico:"🏗", label:"構造物",       sub:"橋梁・建物・擁壁・坑口", primary:["p40","navvis"],alt:["uav"] },
  linear:   { ico:"🛣", label:"道路・線形",   sub:"長く続く道路・トンネル", primary:["uav"],         alt:["p40","navvis"] },
  indoor:   { ico:"🏢", label:"屋内・狭所",   sub:"建屋内・設備・狭い空間", primary:["navvis"],      alt:["p40"] }
};

/* --- 制約マスター（STEP2：手法を確定・組み替える条件） ---
   各選択肢に effect: 手法へのバイアス（force=確定 / drop=除外 / add=追加） */
const CONSTRAINTS = [
  { id:"sky",  ico:"✈️", q:"上空は飛ばせますか？", sub:"航空法・上空支障物・人口集中地区",
    opts:[
      { v:"yes",  label:"飛ばせる",          effect:{} },
      { v:"no",   label:"飛ばせない",        effect:{drop:["uav"], add:["p40","navvis"]}, note:"上空が使えないため、地上手法（P40／NavVis）で代替します。" }
    ]},
  { id:"live", ico:"🚧", q:"供用中で止められますか？", sub:"通行・稼働を止める／規制の可否",
    opts:[
      { v:"stop", label:"止められる",        effect:{} },
      { v:"nostop",label:"止められない",     effect:{force:["navvis"]}, note:"供用を止めずに取得するため、歩行型 NavVis を主軸にします。" }
    ]},
  { id:"prec", ico:"🎯", q:"必要な精度は？", sub:"成果に求める正確さ",
    opts:[
      { v:"mm",   label:"mm級（高精度）",    effect:{force:["p40"]}, note:"mm級が必要なため、据置型 Leica P40 が主軸になります。" },
      { v:"cm",   label:"cm級（一般）",      effect:{} }
    ]},
  { id:"acc",  ico:"🧗", q:"立入・足場は？", sub:"近接・進入のしやすさ",
    opts:[
      { v:"ok",   label:"問題なし",          effect:{} },
      { v:"hard", label:"困難な箇所あり",    effect:{add:["uav","navvis"]}, note:"近接が難しい部位は、上空＝UAV／狭所＝NavVis を組み合わせて到達します。" }
    ]}
];

/* --- 見積りに効く条件（STEP2.5：手法は変えず、結果に注意コメントを出す） --- */
const COST_CONDS = [
  { id:"area", ico:"📐", q:"対象の広さは？",
    opts:[
      { v:"small", label:"狭い・スポット",   note:null },
      { v:"large", label:"広い・広域",       note:"広域のため【現場測量】の比重が上がります（飛行・走査の回数増）。", bucket:"survey" }
    ]},
  { id:"datum", ico:"📍", q:"座標系・基準点は？",
    opts:[
      { v:"have",  label:"基準点あり",        note:null },
      { v:"none",  label:"基準点なし／要設置", note:"基準点の設置・標定測量が別途必要になり【現場測量】工程が増えます。", bucket:"survey" }
    ]},
  { id:"due",  ico:"⏱", q:"納期は？",
    opts:[
      { v:"normal",label:"通常",              note:null },
      { v:"tight", label:"短納期・急ぎ",       note:"短納期の場合は人員・工程の組み方が変わります（体制強化や夜間処理など）。", bucket:"all" }
    ]}
];

/* --- ゴール=成果物マスター（STEP3）。cost=4バケツの重み(0..3) ---
   バケツ: survey=現場測量 / proc=点群処理・解析 / model=3Dモデリング / dwg=図面整合・成果 */
const GOALS = {
  asis:    { label:"現況把握だけ",      sub:"点群・オルソ",
             out:"点群データ ／ オルソ画像", cost:{survey:3,proc:2,model:0,dwg:0},
             methodsHint:"取得した手法そのまま" },
  clash:   { label:"設計と干渉チェック", sub:"現況×計画モデル",
             out:"3Dモデル ／ 干渉チェック資料 ／ 2D図面", cost:{survey:2,proc:2,model:3,dwg:3},
             methodsHint:"取得手法＋BIM/CIM（Civil3D・Navisworks）" },
  fourd:   { label:"施工手順を見せる",   sub:"4Dシミュレーション",
             out:"4D動画 ／ 施工ステップ資料", cost:{survey:2,proc:2,model:3,dwg:2},
             methodsHint:"取得手法＋3Dモデリング＋4D作成" },
  asbuilt: { label:"出来形・土量管理",   sub:"ICT・基準対応",
             out:"出来形ヒートマップ ／ 差分図 ／ 土量計算書", cost:{survey:2,proc:3,model:0,dwg:2},
             methodsHint:"面計測手法＋差分解析" },
  drawing: { label:"図面化（2D図面）",   sub:"既存図との整合",
             out:"2D図面 ／ 3Dモデル", cost:{survey:2,proc:2,model:2,dwg:3},

const BUCKETS = { survey:"現場測量", proc:"点群処理・解析", model:"3Dモデリング", dwg:"図面整合・成果" };

/* 対象×ゴールの相性（逆引き・正引き結果の補足に使用）。
   一部のゴールは特定の対象で特に有効。なければ汎用扱い。 */
const TARGET_GOAL_FIT = {
  terrain:["asis","asbuilt","drawing"],
  structure:["asis","clash","drawing","fourd"],
  linear:["asis","asbuilt","drawing"],
  indoor:["asis","clash","drawing"]
};

/* ============ エンジン：正引き ============ */
/* target, answers{constraintId:value}, goalKey → 推奨手法+理由+費用+注意 */
function recommend(targetKey, answers, goalKey){
  const t = TARGETS[targetKey];
  let set = new Set(t.primary);              // ベース候補
  let reasons = [];
  let notes = [];

  // 制約を適用
  CONSTRAINTS.forEach(c=>{
    const v = answers[c.id];
    if(!v) return;
    const opt = c.opts.find(o=>o.v===v);
    if(!opt) return;
    const e = opt.effect||{};
    if(e.force){ set = new Set(e.force); reasons.push(opt.note); }
    if(e.drop){ e.drop.forEach(m=>set.delete(m)); if(opt.note) reasons.push(opt.note); }
    if(e.add){ e.add.forEach(m=>set.add(m)); if(opt.note && !reasons.includes(opt.note)) reasons.push(opt.note); }
  });

  // 空になった場合は対象の代替で救済
  if(set.size===0){ t.alt.forEach(m=>set.add(m)); }

  const methods = [...set];
  // 費用バケツ
  const goal = GOALS[goalKey] || null;

  return { target:t, methods, reasons:reasons.filter(Boolean), goal, goalKey };
}

/* 見積り条件 → 注意コメント＋バケツ補正 */
function costNotes(costAnswers, baseCost){
  const cost = Object.assign({}, baseCost);
  const msgs = [];
  COST_CONDS.forEach(c=>{
    const v = costAnswers[c.id];
    if(!v) return;
    const opt = c.opts.find(o=>o.v===v);
    if(opt && opt.note){
      msgs.push(opt.note);
      if(opt.bucket==="survey") cost.survey = Math.min(3, (cost.survey||0)+1);
      if(opt.bucket==="all"){ /* 全体注意のみ。重みは触らない */ }
    }
  });
  return { cost, msgs };
}

/* ============ エンジン：逆引き（手法から） ============ */
function reverseByMethod(methodKey){
  const targets = Object.entries(TARGETS)
    .filter(([k,t])=> t.primary.includes(methodKey) || t.alt.includes(methodKey))
    .map(([k,t])=> ({key:k, ...t, role: t.primary.includes(methodKey)?"主役":"補助"}));
  return { method:METHODS[methodKey], targets };
}

/* ============ エンジン：逆引き（成果物から） ============ */
function reverseByGoal(goalKey){
  const goal = GOALS[goalKey];
  // この成果物が有効な対象
  const targets = Object.entries(TARGET_GOAL_FIT)
    .filter(([k,gs])=> gs.includes(goalKey))
    .map(([k])=> ({key:k, ...TARGETS[k]}));
  return { goal, goalKey, targets };
}


/* ============ UI 状態 ============ */
let mode="flow";
let step=0;                 // 0:対象 1..n:制約 then costConds then goal
let sel={ target:null, cons:{}, costc:{}, goal:null };

const view=document.getElementById("view");

function setMode(m){
  mode=m; step=0; sel={target:null,cons:{},costc:{},goal:null};
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.mode===m));
  if(m==="flow") renderFlow();
  if(m==="bymethod") renderByMethod();
  if(m==="bygoal") renderByGoal();
}

/* ---- 正引きフロー ---- */
// ステップ順: 0=対象, 1..4=制約(CONSTRAINTS), 5..7=費用条件(COST_CONDS), 8=ゴール, 9=結果
const FLOW_LAST = 1 + CONSTRAINTS.length + COST_CONDS.length; // index of goal step
function renderFlow(){
  const totalSteps = FLOW_LAST+1; // +goal
  let html='<div class="prog">';
  for(let i=0;i<=FLOW_LAST;i++) html+=`<div class="p ${i<=step?'on':''}"></div>`;
  html+='</div><div class="step">';

  if(step===0){
    html+=stepHead("STEP 1 ｜ 何を3Dにしたいですか？","対象を選ぶと、手法のベースが決まります。");
    html+='<div class="opts g4">';
    for(const [k,t] of Object.entries(TARGETS))
      html+=opt(k, sel.target===k, t.ico, t.label, t.sub, `pick('target','${k}')`);
    html+='</div>';
  } else if(step>=1 && step<=CONSTRAINTS.length){
    const c=CONSTRAINTS[step-1];
    html+=stepHead(`STEP 2 ｜ ${c.q}`, c.sub+"（手法を確定・組み合わせます）");
    html+='<div class="opts g2">';
    c.opts.forEach(o=> html+=opt(o.v, sel.cons[c.id]===o.v, c.ico, o.label, "", `pick('con','${c.id}','${o.v}')`));
    html+='</div>';
  } else if(step>=1+CONSTRAINTS.length && step<FLOW_LAST){
    const c=COST_CONDS[step-1-CONSTRAINTS.length];
    html+=stepHead(`STEP 2.5 ｜ ${c.q}`, "手法は変わりません。作業コストの見立てに反映します。");
    html+='<div class="opts g2">';
    c.opts.forEach(o=> html+=opt(o.v, sel.costc[c.id]===o.v, c.ico, o.label, "", `pick('costc','${c.id}','${o.v}')`));
    html+='</div>';
  } else if(step===FLOW_LAST){
    html+=stepHead("STEP 3 ｜ 最終的に何が欲しいですか？","ゴールで「作業コストがどの工程に乗るか」が決まります。");
    html+='<div class="opts g3">';
    for(const [k,g] of Object.entries(GOALS))
      html+=opt(k, sel.goal===k, "🎯", g.label, g.sub, `pick('goal','${k}')`);
    html+='</div>';
  }
  // nav
  html+='<div class="nav">';
  html+= step>0 ? `<button class="btn ghost" onclick="back()">← 戻る</button>` : `<span></span>`;
  const canNext = (step===0&&sel.target)|| (step>=1&&step<=CONSTRAINTS.length&&sel.cons[CONSTRAINTS[step-1].id])
                || (step>=1+CONSTRAINTS.length&&step<FLOW_LAST&&sel.costc[COST_CONDS[step-1-CONSTRAINTS.length].id]);
  if(step<FLOW_LAST) html+=`<button class="btn prim" ${canNext?'':'disabled'} onclick="next()">次へ →</button>`;
  else html+=`<button class="btn prim" ${sel.goal?'':'disabled'} onclick="showResult()">結果を見る →</button>`;
  html+='</div>';
  html+='<div class="hintbar">商談の流れで、わかっている項目だけ選んでもOK。未選択でも次へ進めます。</div>';
  html+='</div>';
  view.innerHTML=html;
}
function stepHead(t,d){return `<h2>${t}</h2><div class="sd">${d}</div>`;}
function opt(v,on,ic,ttl,sub,onclick){return `<div class="opt ${on?'on':''}" onclick="${onclick}"><div class="ic">${ic}</div><div class="ttl">${ttl}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;}
function pick(kind,a,b){
  if(kind==='target'){sel.target=a;}
  if(kind==='con'){sel.cons[a]=b;}
  if(kind==='costc'){sel.costc[a]=b;}
  if(kind==='goal'){sel.goal=a;}
  renderFlow();
  // auto-advance for single-pick steps (target/goal stay; let user press 次へ to keep control)
}
function next(){ if(step<FLOW_LAST){step++;renderFlow();} }
function back(){ if(step>0){step--;renderFlow();} }

function showResult(){
  const r=recommend(sel.target, sel.cons, sel.goal);
  const goal=GOALS[sel.goal];
  const cn=costNotes(sel.costc, goal.cost);
  let html='<div class="result">';
  // hero
  html+=`<div class="rhero"><div class="rk">RECOMMENDATION — あなたの現場へのご提案</div>
    <h2>${r.target.label}を、この手法で。</h2>
    <div class="mlist">${r.methods.map(m=>`<span class="mchip">${METHODS[m].short}<small>${METHODS[m].tag}</small></span>`).join('')}</div></div>`;
  // deliverable image
  if(DELIV[sel.goal]) html+=`<div class="sect deliv"><div class="sh">DELIVERABLE — 成果物イメージ：${goal.label}</div><img src="${DELIV[sel.goal]}" alt="${goal.label}"><div class="dcap">${goal.out}</div></div>`;
  // why
  html+='<div class="sect"><div class="sh">WHY — なぜこの手法がベストか</div><ul class="why">';
  html+=`<li class="base">対象が「${r.target.label}」なので、${r.methods.map(m=>METHODS[m].short).join('・')}が基本になります。</li>`;
  r.reasons.forEach(x=> html+=`<li>${x}</li>`);
  if(r.methods.length>1) html+=`<li>1台では届かない部分も、複数手法の<b>組み合わせ</b>で取得漏れなく対応します。</li>`;
  html+='</ul></div>';
  // cost buckets
  html+='<div class="sect cost"><div class="sh">WORK COST — 作業コスト（どの工程に手間がかかるか）</div>';
  for(const [bk,label] of Object.entries(BUCKETS)){
    const lv=cn.cost[bk]||0; const pct=[8,40,70,100][lv];
    const txt=["ほぼ無し","小","中","大"][lv];
    html+=`<div class="row"><div class="bk">${label}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="lv">${txt}</div></div>`;
  }
  html+=`<div class="lead">この案件は <b>${goal.methodsHint}</b> が中心。主な成果物：<b>${goal.out}</b></div></div>`;
  // notes
  if(cn.msgs.length){
    html+='<div class="sect notes" style="border-color:rgba(255,122,69,.34)"><div class="sh" style="color:var(--warn)">確認事項（作業コストに影響）</div>';
    cn.msgs.forEach(m=> html+=`<div class="note"><b>!</b><span>${m}</span></div>`);
    html+='</div>';
  }
  // links
  html+='<div class="sect"><div class="sh">DETAIL — 機材の詳しい説明</div>';
  html+=r.methods.map(m=>`<a class="linkbtn" href="${METHODS[m].sheet}">${METHODS[m].short} のシートを開く →</a>`).join(' ');
  html+='</div>';
  html+=`<div class="nav" style="flex-wrap:wrap;gap:10px">
    <button class="btn ghost" onclick="step=FLOW_LAST;renderFlow()">← ゴールを変える</button>
    <span style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn ghost" onclick="copyLink()">🔗 この結果のリンクをコピー</button>
      <button class="btn prim" onclick="window.print()">📄 PDFで保存</button>
      <button class="btn ghost" onclick="setMode('flow')">↺ 最初からやり直す</button>
    </span></div>`;
  html+='</div>';
  view.innerHTML=html;
}

/* ---- 逆引き：手法から ---- */
function renderByMethod(){
  let html='<div class="step"><h2>手法から逆引き</h2><div class="sd">お客様が手法名を出したとき。タップで「何ができる／どんな現場向きか」を表示。</div>';
  html+='<div class="rev g4">';
  for(const [k,m] of Object.entries(METHODS))
    html+=`<div class="revcard" onclick="revM('${k}')"><div class="rt">${m.short}</div><div class="rtag">${m.tag}</div><div class="rg">${m.good}</div></div>`;
  html+='</div><div id="revout" class="revout"></div></div>';
  view.innerHTML=html;
}
function revM(k){
  document.querySelectorAll('.rev .revcard').forEach(c=>c.classList.remove('on'));
  event.currentTarget.classList.add('on');
  const r=reverseByMethod(k);
  let html=`<div class="sect"><div class="sh">${r.method.name} が向く対象</div><ul class="why">`;
  r.targets.forEach(t=> html+=`<li>${t.ico} <b>${t.label}</b>（${t.role}）— ${t.sub}</li>`);
  html+=`</ul><a class="linkbtn" href="${r.method.sheet}">この機材のシートを開く →</a></div>`;
  document.getElementById('revout').innerHTML=html;
  document.getElementById('revout').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---- 逆引き：成果物から ---- */
function renderByGoal(){
  let html='<div class="step"><h2>成果物から逆引き</h2><div class="sd">お客様の欲しいものが先に決まっているとき。タップで「必要な手法と、作業コストのかかる工程」を表示。</div>';
  html+='<div class="rev g5">';
  for(const [k,g] of Object.entries(GOALS))
    html+=`<div class="revcard" onclick="revG('${k}')"><div class="rt">${g.label}</div><div class="rtag">${g.sub}</div><div class="rg">${g.out}</div></div>`;
  html+='</div><div id="revout" class="revout"></div></div>';
  view.innerHTML=html;
}
function revG(k){
  document.querySelectorAll('.rev .revcard').forEach(c=>c.classList.remove('on'));
  event.currentTarget.classList.add('on');
  const r=reverseByGoal(k); const g=r.goal;
  let html='';
  if(DELIV[k]) html+=`<div class="sect deliv"><div class="sh">DELIVERABLE — 成果物イメージ</div><img src="${DELIV[k]}" alt="${g.label}"><div class="dcap">${g.out}</div></div>`;
  html+=`<div class="sect"><div class="sh">「${g.label}」に必要なもの</div>`;
  html+=`<div class="out" style="margin-bottom:12px">中心となる進め方：<b>${g.methodsHint}</b><br>主な成果物：<b>${g.out}</b></div>`;
  html+=`<div class="sh" style="margin-top:6px">向いている対象</div><ul class="why">`;
  r.targets.forEach(t=> html+=`<li>${t.ico} <b>${t.label}</b> — ${t.sub}</li>`);
  html+='</ul></div>';
  // cost buckets for this goal (base, no cost conds)
  html+='<div class="sect cost"><div class="sh">WORK COST — 作業コスト（標準）</div>';
  for(const [bk,label] of Object.entries(BUCKETS)){
    const lv=g.cost[bk]||0; const pct=[8,40,70,100][lv]; const txt=["ほぼ無し","小","中","大"][lv];
    html+=`<div class="row"><div class="bk">${label}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="lv">${txt}</div></div>`;
  }
  html+='</div>';
  document.getElementById('revout').innerHTML=html;
  document.getElementById('revout').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ===== #6 結果の保存・復元（URLハッシュに選択内容を埋め込む） ===== */
function encodeSel(){ return btoa(unescape(encodeURIComponent(JSON.stringify(sel)))); }
function decodeSel(s){ try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
function copyLink(){
  const url=location.origin+location.pathname+'#r='+encodeSel();
  const done=()=>{ const t=document.createElement('div'); t.textContent='リンクをコピーしました'; t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:#0b1630;font-weight:800;padding:10px 18px;border-radius:10px;z-index:99'; document.body.appendChild(t); setTimeout(()=>t.remove(),1600); };
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(done).catch(()=>prompt('このリンクをコピーしてください',url)); } else { prompt('このリンクをコピーしてください',url); }
}
(function restore(){
  const m=location.hash.match(/#r=(.+)$/);
  if(m){ const s=decodeSel(m[1]); if(s&&s.target&&s.goal){ sel=s; mode='flow'; showResult(); return; } }
  renderFlow();
})();
